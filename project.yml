name: Scribe
options:
  bundleIdPrefix: com.aleksei
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "0.9.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"

targets:
  Scribe:
    type: application
    platform: macOS
    sources:
      - path: Scribe
        excludes:
          - "*.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aleksei.scribe
        INFOPLIST_FILE: Scribe/Info.plist
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: Scribe
    dependencies:
      - package: WhisperKit
      - package: KeyboardShortcuts
